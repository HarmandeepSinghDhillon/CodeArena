spring.application.name=CodeArena
server.port=${PORT:5000}

spring.datasource.url=${DATABASE_URL:${JDBC_DATABASE_URL:jdbc:h2:mem:coderunnerdb;DB_CLOSE_ON_EXIT=FALSE}}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:password}
spring.jpa.hibernate.ddl-auto=update

app.jwt.secret=${APP_JWT_SECRET:harisonputter9878harisonputter9878harisonputter9878}
app.jwt.expirationMs=86400000

# Supabase Storage Configuration for User Avatars
supabase.url=${SUPABASE_URL:}
supabase.key=${SUPABASE_KEY:}
supabase.bucket=${SUPABASE_BUCKET:avatars}

# Configure higher limits for file uploads (Default is 1MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB